<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quiz | NeuroLeap Junior</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/quiz.css">
</head>

<body>

    <main class="quiz-container">
        <section class="quiz-header">
            <div>
                <span id="categoryLabel">Mission</span>
                <strong id="questionCounter">1 / 5</strong>
            </div>

            <div class="timer-box">
                ⏱ <span id="timer">15</span>s
            </div>
        </section>

        <div class="quiz-progress">
            <div id="quizProgressFill"></div>
        </div>

        <section class="question-card">
            <div id="questionIcon" class="question-icon">
                🧠
            </div>

            <h1 id="questionText">
                Loading question...
            </h1>

            <div id="answerGrid" class="answer-grid"></div>

            <p id="feedbackMessage"></p>
        </section>
    </main>

    <script type="module" src="js/quiz.js"></script>

</body>
</html>
